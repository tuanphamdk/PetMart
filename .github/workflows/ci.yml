name: PetMart CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

# Hủy lần chạy cũ nếu có commit mới push lên cùng nhánh
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          # Chỉ định rõ file lock của backend để cache chính xác
          cache-dependency-path: backend/package-lock.json

      - name: Check Backend syntax & dependencies
        working-directory: backend
        run: |
          npm ci --prefer-offline --no-audit
          node --check server.js

  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install Frontend dependencies & Build
        run: |
          npm ci --prefer-offline --no-audit
          npm run build
